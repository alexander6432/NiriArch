[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.75
center = [ "lock_keys", "clipboard", "clock", "notifications", "tray" ]
contact_shadow = true
end = [ "bluetooth", "network", "battery", "session" ]
margin_edge = 4
margin_ends = 4.0
padding = 8
radius = 8
start = [ "launcher", "taskbar", "active_window", "media", "wallpaperAleatorio" ]
thickness = 32
widget_spacing = 8

[calendar]
refresh_minutes = 60

[control_center]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "audio"

[desktop_widgets]
schema_version = 1
widget_order = [ "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 192.0
    box_width = 256.0
    cx = 1227.0
    cy = 160.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        color = "on_surface"
        forecast_days = 2
        shadow = true
        show_forecast = true

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 256.0
    box_width = 1024.0
    cx = 682.0
    cy = 385.79998779296875
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        aspect_ratio = 4.0
        background = false
        bands = 32.0
        centered = true
        color_1 = "primary"
        color_2 = "primary"
        mirrored = true
        show_when_idle = false

[dock]
auto_hide = true
background_opacity = 0.75
icon_size = 32
item_spacing = 8
launcher_position = "start"
margin_ends = 8
pinned = [ "firefox", "google-chrome", "kitty", "org.gnome.Nautilus" ]
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = true
    timeout = 900

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.75
tint_intensity = 0.25

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000006"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 683.0
    cy = 601.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 624.0
    cx = 699.0
    cy = 304.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        circle = true
        clock_style = "digital"
        color = "primary"
        format = "%I:%M %p"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 192.0
    box_width = 256.0
    cx = 1238.0
    cy = 160.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        color = "primary"
        forecast_days = 2
        show_forecast = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 64.0
    box_width = 512.0
    cx = 683.0
    cy = 480.0
    output = "eDP-1"
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        shadow = true
        title = "Bienvenido Alexander"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 128.0
    box_width = 320.0
    cx = 203.0
    cy = 127.99999237060547
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        background = false
        hide_when_no_media = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 32.0
    box_width = 640.0
    cx = 683.0
    cy = 704.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        background = false
        clock_style = "digital"
        color = "primary"
        format = "%A, %d de %B del %Y"

[nightlight]
enabled = true
temperature_night = 5000

[notification]
background_opacity = 0.75
offset_x = 16

[osd]
background_opacity = 0.75
offset_x = 16
position = "top_right"

[plugins]
enabled = []

    [[plugins.source]]
    auto_update = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    auto_update = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/alex/Imágenes/IMG_20220923_105006.jpg"
clipboard_history_max_entries = 20.0
date_format = "%_A, %d%n%_B del %Y%n"
font_family = "JetBrainsMono NF"
lang = "es"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = false
time_format = "%I:%M %p"
ui_scale = 0.85000000521540642

    [shell.panel]
    borders = false
    clipboard_placement = "floating"
    control_center_placement = "floating"
    launcher_compact = true
    launcher_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.screenshot]
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    label = "Bloquear"
    variant = "primary"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    label = "Cerrar sesión"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    label = "Suspender"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    label = "Reiniciar"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    label = "Apagar"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.75
    blur = 16

[system.monitor]
enabled = false

[theme]
builtin = "Eldritch"
community_palette = "ADW"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "niri", "qt" ]
    community_ids = [ "papirus-icons", "telegram", "hyprtoolkit" ]

[wallpaper]
directory = "/home/alex/Imágenes/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/alex/Descargas/wallhaven-nrdgkj.jpg"

    [wallpaper.last]
    path = "/home/alex/Descargas/wallhaven-nrdgkj.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/alex/Descargas/wallhaven-nrdgkj.jpg"

[weather]
auto_locate = true

[widget.active_window]
display = "text_only"
max_length = 200.0
min_length = 50.0
title_scroll = "on_hover"

[widget.audio_visualizer]
show_when_idle = true

[widget.battery]
warning_threshold = 25

[widget.bluetooth]
show_label = true

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.clock]
color = "primary"
format = "%a %I:%M %P"
tooltip_format = "%A, %d de %B del %Y "

[widget.launcher]
color = "primary"

[widget.lock_keys]
hide_when_off = true
show_scroll_lock = true

[widget.media]
hide_when_no_media = true
max_length = 100.0
min_length = 50.0
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.session]
color = "error"

[widget.taskbar]
empty_color = "tertiary"
group_by_workspace = true

[widget.wallpaperAleatorio]
command = "/home/alex/.config/noctalia/wallpaper/wallpaper -tag \"fire\""
glyph = "arrows-random"
tooltip = "Cambiar de fondo"
type = "custom_button"
