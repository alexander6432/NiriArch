##################
### ANIMATIONS ###
##################

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = linear,         0,    0,    1,    1
    bezier = easeOutCubic,   0.33, 1,    0.68, 1
    bezier = easeInCubic,    0.32, 0,    0.67, 0
    bezier = easeInOutCubic, 0.65, 0.05, 0.35, 1
    bezier = easeInCirc,     0.55, 0,    1,    0.45
    bezier = easeOutCirc,    0,    0.55, 0.45, 1
    bezier = easeInOutCirc,  0.85, 0,    0.15, 1
    bezier = easeInBack,     0.36, 0,    0.66, -0.56
    bezier = easeOutBack,    0.34, 1.56, 0.64, 1
    bezier = easeInOutBack,  0.68, -0.6, 0.32, 1.6

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #                       NAME,            ONOFF, SPEED, CURVE,       [STYLE]
    animation =             global,              1, 10,  default

        # styles: slide(top, bottom, left, right), popin(0-100%), gnomed
        animation         = windows,             1, 3.0, easeInOutCirc, slide
            animation     = windowsIn,           1, 3.0, easeOutCirc,   slide bottom
            animation     = windowsOut,          1, 3.0, easeInCirc,    slide top
            animation     = windowsMove,         1, 4.0, easeInOutCirc

        # styles: slide(top, bottom, left, right), popin, fade
        animation         = layers,              1, 2.0, easeInOutCirc, slide
            animation     = layersIn,            1, 2.0, easeOutCirc,   slide bottom
            animation     = layersOut,           1, 2.0, easeInCirc,    slide top

        animation         = fade,                1, 2.0, easeInOutCirc
            animation     = fadeIn,              1, 2.0, easeOutCirc
            animation     = fadeOut,             1, 2.0, easeInCirc
            animation     = fadeSwitch,          1, 4.0, easeInOutCirc
            animation     = fadeShadow,          1, 4.0, easeInOutCirc
            animation     = fadeDim,             1, 4.0, easeInOutCirc
            animation     = fadeLayers,          1, 2.0, easeInOutCirc
                animation = fadeLayersIn,        1, 2.0, easeOutCirc
                animation = fadeLayersOut,       1, 2.0, easeInCirc
            animation     = fadePopups,          1, 2.0, easeInOutCirc
                animation = fadePopupsIn,        1, 2.0, easeOutCirc
                animation = fadePopupsOut,       1, 2.0, easeInCirc
            animation     = fadeDpms,            1, 4.0, easeInOutCirc

        animation         = border,              1, 4.0, easeInOutCirc
        # styles: once, loop
        animation         = borderangle,         1, 60,  easeInOutCirc

        # styles: slide(0-100%), slidevert(0-100%), fade, slidefade(0-100%), slidefadevert(0-100%)
        animation         = workspaces,          1, 2.0, easeInOutCirc, slidefade 25%
            animation     = workspacesIn,        1, 2.0, easeOutCirc,   slidefade 25%
            animation     = workspacesOut,       1, 2.0, easeInCirc,    slidefade 25%
            animation     = specialWorkspace,    1, 2.0, easeInOutCirc, slidefadevert 25%
                animation = specialWorkspaceIn,  1, 2.0, easeOutCirc,   slidefadevert 25%
                animation = specialWorkspaceOut, 1, 2.0, easeInCirc,    slidefadevert 25%

        animation          = zoomFactor,          1, 4.0, easeOutCirc
        animation          = monitorAdded,        1, 10,  easeInOutCirc
}
