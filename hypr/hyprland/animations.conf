##################
### ANIMATIONS ###
##################

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #                       NAME,            ONOFF, SPEED, CURVE,       [STYLE]
    animation =             global,              1, 10,   default
        animation =         windows,             1, 4.79, easeOutQuint
            animation =     windowsIn,           1, 5.0,  easeOutQuint, popin 75%
            animation =     windowsOut,          1, 2.0,  linear,       popin 75%
            animation =     windowsMove,         1, 4.79, easeOutQuint
        animation =         layers,              1, 3.81, easeOutQuint
            animation =     layersIn,            1, 4,    easeOutQuint, fade
            animation =     layersOut,           1, 1.5,  linear,       fade
        animation =         fade,                1, 3.03, quick
            animation =     fadeIn,              1, 1.73, almostLinear
            animation =     fadeOut,             1, 1.46, almostLinear
            animation =     fadeSwitch,          1, 3.03, quick
            animation =     fadeShadow,          1, 3.03, quick
            animation =     fadeDim,             1, 3.03, quick
            animation =     fadeLayers,          1, 1.79, almostLinear
                animation = fadeLayersIn,        1, 1.79, almostLinear
                animation = fadeLayersOut,       1, 1.39, almostLinear
            animation =     fadePopups,          1, 3.03, quick
                animation = fadePopupsIn,        1, 3.03, quick
                animation = fadePopupsOut,       1, 3.03, quick
            animation =     fadeDpms,            1, 3.03, quick
        animation =         border,              1, 5.39, easeOutQuint
        animation =         borderangle,         1, 5.39, easeOutQuint
        animation =         workspaces,          1, 3.0,  almostLinear, slidefadevert
            animation =     workspacesIn,        1, 3.0,  almostLinear, slidefadevert
            animation =     workspacesOut,       1, 3.0,  almostLinear, slidefadevert
            animation =     specialWorkspace,    1, 1.94, almostLinear, fade
                animation = specialWorkspaceIn,  1, 1.94, almostLinear, fade
                animation = specialWorkspaceOut, 1, 1.94, almostLinear, fade
        animation =         zoomFactor,          1, 7,    quick
        animation =         monitorAdded,        1, 7,    quick
}
