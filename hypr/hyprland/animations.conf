##################
### ANIMATIONS ###
##################

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = linear,         0,    0,    1,    1
    bezier = easeOutCubic,   0.33, 1,    0.68, 1
    bezier = easeInCubic,    0.32, 0,    0.67, 0
    bezier = easeInOutCubic, 0.65, 0.05, 0.35, 1
    bezier = easeOutCirc,    0,    0.55, 0.45, 1
    bezier = easeInCirc,     0.85, 0,    0.15, 1
    bezier = easeInOutCirc,  0.65, 0.05, 0.35, 1
    bezier = easeOutBack,    0.36, 0,    0.66, -0.56
    bezier = easeInBack,     0.34, 1.56, 0.64, 1
    bezier = easeInOutBack,  0.68, -0.6, 0.32, 1.6

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #                       NAME,            ONOFF, SPEED, CURVE,       [STYLE]
    animation =             global,              1, 10,   default

        animation =         windows,             1, 4.0, easeInOutCirc, popin 75%
            animation =     windowsIn,           1, 4.0, easeOutCirc,   popin 75%
            animation =     windowsOut,          1, 4.0, easeInCirc,    popin 75%
            animation =     windowsMove,         1, 4.0, easeOutCirc

        animation =         layers,              1, 4.0, easeInOutCirc, popin 75%
            animation =     layersIn,            1, 4.0, easeOutCirc,   popin 75%
            animation =     layersOut,           1, 4.0, easeInCirc,    popin 75%

        animation =         fade,                1, 4.0, easeInOutCirc
            animation =     fadeIn,              1, 4.0, easeOutCirc
            animation =     fadeOut,             1, 4.0, easeInCirc
            animation =     fadeSwitch,          1, 4.0, easeInOutCirc
            animation =     fadeShadow,          1, 4.0, easeInOutCirc
            animation =     fadeDim,             1, 4.0, easeInOutCirc
            animation =     fadeLayers,          1, 4.0, easeInOutCirc
                animation = fadeLayersIn,        1, 4.0, easeOutCirc
                animation = fadeLayersOut,       1, 4.0, easeInCirc
            animation =     fadePopups,          1, 4.0, easeInOutCirc
                animation = fadePopupsIn,        1, 4.0, easeOutCirc
                animation = fadePopupsOut,       1, 4.0, easeInCirc
            animation =     fadeDpms,            1, 4.0, easeInOutCirc

        animation =         border,              1, 4.0, easeInOutCirc
        animation =         borderangle,         1, 60,  easeInOutCirc

        animation =         workspaces,          1, 4.0, easeInOutCirc, fade
            animation =     workspacesIn,        1, 4.0, easeOutCirc,   slidefade
            animation =     workspacesOut,       1, 4.0, easeInCirc,    slidefade
            animation =     specialWorkspace,    1, 4.0, easeInOutCirc, slidefadevert
                animation = specialWorkspaceIn,  1, 4.0, easeOutCirc,   slidefadevert
                animation = specialWorkspaceOut, 1, 4.0, easeInCirc,    slidefadevert

        animation =         zoomFactor,          1, 4.0, easeInOutCirc
        animation =         monitorAdded,        1, 10,  easeInOutCirc
}
