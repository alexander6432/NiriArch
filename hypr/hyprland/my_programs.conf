###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$chrome         = google-chrome-stable
$firefox        = firefox
$file_manager   = nautilus
$terminal       = kitty fish
$terminal_float = kitty --class="terminal-float" fish
$atajos         = kitty --class="hypr-cheatsheet" ~/.config/scripts/cheatsheet_hyprland.sh

$layout   = ~/.config/scripts/dynamic_layouts_hyprland.sh
$maximize = ~/.config/scripts/maximize_hyprland.sh
$pin_ws   = ~/.config/scripts/pin_tiled_hyprland.sh
$relative = ~/.config/scripts/relative_ws_hyprland.sh

$salir = command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

$zoom_p = hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
$zoom_m = hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')

$borrar_notificaciones = qs -c noctalia-shell ipc call notifications clear
$calendario            = qs -c noctalia-shell ipc call calendar toggle
$centro_notificaciones = qs -c noctalia-shell ipc call notifications toggleHistory
$centro_control        = qs -c noctalia-shell ipc call controlCenter toggle
$bloquear_pantalla     = qs -c noctalia-shell ipc call lockScreen lock
$idle_inhibidor        = qs -c noctalia-shell ipc call idleInhibitor toggle
$menu                  = qs -c noctalia-shell ipc call launcher toggle
$power_menu            = qs -c noctalia-shell ipc call sessionMenu toggle
$toggle_bar            = qs -c noctalia-shell ipc call bar toggle
$wallpaper_random      = qs -c noctalia-shell ipc call wallpaper random all
$wallpaper_selector    = qs -c noctalia-shell ipc call wallpaper toggle

$subir_volumen        = qs -c noctalia-shell ipc call volume increase
$bajar_volumen        = qs -c noctalia-shell ipc call volume decrease
$silenciar_volumen    = qs -c noctalia-shell ipc call volume muteOutput
$silenciar_microfono  = qs -c noctalia-shell ipc call volume muteInput
$subir_brillo         = qs -c noctalia-shell ipc call brightness increase
$bajar_brillo         = qs -c noctalia-shell ipc call brightness decrease
$pausar_reproducir    = qs -c noctalia-shell ipc call media playPause
$detener_reproduccion = qs -c noctalia-shell ipc call media stop
$anterior_pista       = qs -c noctalia-shell ipc call media previous
$siguiente_pista      = qs -c noctalia-shell ipc call media next

$captura_ventana  = hyprshot -m window -m active -o ~/Imágenes/"Capturas" -f "Captura_de_Ventana_$(date +%F_%H-%M-%S).png"

$captura_pantalla = hyprshot -m output -m active -o ~/Imágenes/"Capturas" -f "Captura_de_Pantalla_$(date +%F_%H-%M-%S).png"

$captura_area     = hyprshot -m region -o ~/Imágenes/"Capturas" -f "Captura_de_Area_$(date +%F_%H-%M-%S).png"
