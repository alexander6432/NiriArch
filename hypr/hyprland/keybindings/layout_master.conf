bindd = $mainMod, S, Enfocar Siguiente Ventana (Master), layoutmsg, cyclenext loop
bindd = $mainMod, A, Enfocar Anterior Ventana (Master),  layoutmsg, cycleprev loop

bindd = $mainMod SHIFT, S, Intercambia Ventana con la Siguiente (Master), layoutmsg, swapnext loop
bindd = $mainMod SHIFT, A, Intercambia Ventana con la Anterior (Master),  layoutmsg, swapprev loop

bindd = $mainMod CTRL, S, Rotar Ventanas (Master),         layoutmsg, rollprev
bindd = $mainMod CTRL, A, Rotar Ventanas Inverso (Master), layoutmsg, rollnext

bindd = $mainMod, O, Enfocar Ventana Maestra (Master),                    layoutmsg, focusmaster previous
bindd = $mainMod, I, Intercambia Ventana con la Ventana Maestra (Master), layoutmsg, swapwithmaster auto

bindd = $mainMod, Plus,  Incrementar Dimensión de Ventana Maestra (Master), layoutmsg, mfact +0.05
bindd = $mainMod, Minus, Disminuir Dimensión de Ventana Maestra (Master),   layoutmsg, mfact -0.05

