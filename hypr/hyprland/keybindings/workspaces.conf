##################
### WORKSPACES ###
##################

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Ir al Espacio de Trabajo 1,  exec, $pin_ws goto 1
bindd = $mainMod, 2, Ir al Espacio de Trabajo 2,  exec, $pin_ws goto 2
bindd = $mainMod, 3, Ir al Espacio de Trabajo 3,  exec, $pin_ws goto 3
bindd = $mainMod, 4, Ir al Espacio de Trabajo 4,  exec, $pin_ws goto 4
bindd = $mainMod, 5, Ir al Espacio de Trabajo 5,  exec, $pin_ws goto 5
bindd = $mainMod, 6, Ir al Espacio de Trabajo 6,  exec, $pin_ws goto 6
bindd = $mainMod, 7, Ir al Espacio de Trabajo 7,  exec, $pin_ws goto 7
bindd = $mainMod, 8, Ir al Espacio de Trabajo 8,  exec, $pin_ws goto 8
bindd = $mainMod, 9, Ir al Espacio de Trabajo 9,  exec, $pin_ws goto 9
bindd = $mainMod, 0, Ir al Espacio de Trabajo 10, exec, $pin_ws goto 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Mover Ventana al Espacio de Trabajo 1,  movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Mover Ventana al Espacio de Trabajo 2,  movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Mover Ventana al Espacio de Trabajo 3,  movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Mover Ventana al Espacio de Trabajo 4,  movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Mover Ventana al Espacio de Trabajo 5,  movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Mover Ventana al Espacio de Trabajo 6,  movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Mover Ventana al Espacio de Trabajo 7,  movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Mover Ventana al Espacio de Trabajo 8,  movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Mover Ventana al Espacio de Trabajo 9,  movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Mover Ventana al Espacio de Trabajo 10, movetoworkspace, 10

# Move active window to a workspace in silent with mainMod + CTRL + [0-9]
bindd = $mainMod CTRL, 1, Mover Ventana al Espacio de Trabajo 1 sin Enfocar,  movetoworkspacesilent, 1
bindd = $mainMod CTRL, 2, Mover Ventana al Espacio de Trabajo 2 sin Enfocar,  movetoworkspacesilent, 2
bindd = $mainMod CTRL, 3, Mover Ventana al Espacio de Trabajo 3 sin Enfocar,  movetoworkspacesilent, 3
bindd = $mainMod CTRL, 4, Mover Ventana al Espacio de Trabajo 4 sin Enfocar,  movetoworkspacesilent, 4
bindd = $mainMod CTRL, 5, Mover Ventana al Espacio de Trabajo 5 sin Enfocar,  movetoworkspacesilent, 5
bindd = $mainMod CTRL, 6, Mover Ventana al Espacio de Trabajo 6 sin Enfocar,  movetoworkspacesilent, 6
bindd = $mainMod CTRL, 7, Mover Ventana al Espacio de Trabajo 7 sin Enfocar,  movetoworkspacesilent, 7
bindd = $mainMod CTRL, 8, Mover Ventana al Espacio de Trabajo 8 sin Enfocar,  movetoworkspacesilent, 8
bindd = $mainMod CTRL, 9, Mover Ventana al Espacio de Trabajo 9 sin Enfocar,  movetoworkspacesilent, 9
bindd = $mainMod CTRL, 0, Mover Ventana al Espacio de Trabajo 10 sin Enfocar, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bindd = $mainMod,       Apostrophe, Ir al Espacio de Trabajo Especial,                        togglespecialworkspace, magic
bindd = $mainMod SHIFT, Apostrophe, Mover Ventana al Espacio de Trabajo Especial,             movetoworkspace, special:magic
bindd = $mainMod CTRL,  Apostrophe, Mover Ventana al Espacio de Trabajo Especial sin Enfocar, movetoworkspacesilent, special:magic

# Navegación Relativa a los Espacios de Trabajo
bindd = $mainMod, Period, Ir al Siguente Espacio de Trabajo Activo, workspace, +1
bindd = $mainMod, Comma,  Ir al Anterior Espacio de Trabajo Activo, workspace, -1

bindd = $mainMod SHIFT, Period, Mover Ventana al Siguente Espacio de Trabajo, movetoworkspace, +1
bindd = $mainMod SHIFT, Comma,  Mover Ventana al Anterior Espacio de Trabajo, movetoworkspace, -1

bindd = $mainMod CTRL, Period, Mover Ventana al Siguente Espacio de Trabajo sin Enfocar, movetoworkspacesilent, +1
bindd = $mainMod CTRL, Comma,  Mover Ventana al Anterior Espacio de Trabajo sin Enfocar, movetoworkspacesilent, -1
