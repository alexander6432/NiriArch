###############
### WINDOWS ###
###############

# Move focus with mainMod + arrow keys
bindd = $mainMod, Left,  Enfocar Ventana de la Izquierda, movefocus,  l
bindd = $mainMod, Right, Enfocar Ventana de la Derecha,   movefocus,  r
bindd = $mainMod, Up,    Enfocar Ventana de Arriba,       movefocus,  u
bindd = $mainMod, Down,  Enfocar Ventana de Abajo,        movefocus,  d

bindd = $mainMod SHIFT, Left,  Mover Ventana hacia la Izquierda, movewindow, l
bindd = $mainMod SHIFT, Right, Mover Ventana hacia la Derecha,   movewindow, r
bindd = $mainMod SHIFT, Up,    Mover Ventana hacia Arriba,       movewindow, u
bindd = $mainMod SHIFT, Down,  Mover Ventana hacia Abajo,        movewindow, d

bindde = $mainMod CTRL, Left,  Mover Ventana Flotante hacia la Izquierda, moveactive, -20 0
bindde = $mainMod CTRL, Right, Mover Ventana Flotante hacia la Derecha,   moveactive, 20 0
bindde = $mainMod CTRL, Up,    Mover Ventana Flotante hacia Arriba,       moveactive, 0 -20
bindde = $mainMod CTRL, Down,  Mover Ventana Flotante hacia Abajo,        moveactive, 0 20

bindde = $mainMod ALT, Left,  Reducir Ancho de Ventana Flotante,                    resizeactive, -10 0
bindde = $mainMod ALT, Right, Aumentar Altura de Ventana Flotante hacia la Derecha, resizeactive, 10 0
bindde = $mainMod ALT, Up,    Aumentar Altura de Ventana Flotante hacia Arriba,     resizeactive, 0 10
bindde = $mainMod ALT, Down,  Reducir Ancho de Ventana Flotante hacia Abajo,        resizeactive, 0 -10

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bindd = $mainMod,       Q, Cerrar Ventana,                               killactive,
bindd = $mainMod SHIFT, Q, Matar Todas las Instancias de una Aplicación, killwindow,

bindd = $mainMod,       M, Maximizar Ventana,                            exec, ~/.config/scripts/maximizar_hypr.sh
bindd = $mainMod SHIFT, M, Pantalla Completa,                            fullscreen, 0
bindd = $mainMod CTRL,  M, Pantalla Completa (Fake),                     fullscreenstate, 0 3

bindd = ALT,       Tab, Anterior Ventana Enfocada,   focuscurrentorlast
bindd = ALT SHIFT, Tab, Enfocar Siguientes Ventanas, cyclenext,

bindd = $mainMod,       F, Alternar a Flotante,        togglefloating,
bindd = $mainMod SHIFT, F, Pseudoflotante,             pseudo
bindd = $mainMod,       P, Fijar Ventana Flotante,     pin,

bindd = $mainMod,       C, Centrar Ventana Flotante,   centerwindow,

bindd = $mainMod,       T, Etiqueta,   tagwindow, pinTiled

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Mover Ventana (Mouse),         movewindow
binddm = $mainMod, ALT_L    , Redimensionar Ventana (Mouse), resizewindow
